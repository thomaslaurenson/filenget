name: Vuln

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  vuln:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make vuln
